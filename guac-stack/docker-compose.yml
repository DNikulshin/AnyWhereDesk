services:

  # ── PostgreSQL 15 с healthcheck ─────────────────────────
  guac-db:
    image: postgres:15-alpine
    container_name: guac-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       guacamole_db
      POSTGRES_USER:     guac_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro   # SQL-схема (только при первом старте)
      - ./dbdata:/var/lib/postgresql/data        # персистентные данные
    healthcheck:                                  # FIX#1: Guacamole ждёт готовности БД
      test: ["CMD-SHELL", "pg_isready -U guac_user -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [guac-net]

  # ── Guacd (протокол-демон) ──────────────────────────────
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: guacd
    restart: unless-stopped
    volumes:
      - ./recordings:/var/lib/guacamole/recordings
      - ./shared_files:/mnt/guac_share
    networks: [guac-net]

  # ── Guacamole Frontend ──────────────────────────────────
  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: guac-client
    restart: unless-stopped
    depends_on:
      guac-db:                                   # FIX#1: ждём healthy от Postgres
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME:     guacd
      POSTGRES_HOSTNAME:  guac-db
      POSTGRES_DATABASE:  guacamole_db
      POSTGRES_USER:      guac_user
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      TOTP_ENABLED:       "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./extensions:/etc/guacamole/extensions:ro  # FIX#4: TOTP jar монтируется физически
    networks: [guac-net]

  # ── Caddy с Cloudflare DNS-challenge ────────────────────
  caddy:
    container_name: caddy-proxy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.caddy             # Собираем с cloudflare-плагином
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                          # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data                     # SSL-сертификаты
      - ./caddy/config:/config                 # конфиг Caddy
    environment:
      CLOUDFLARE_API_TOKEN:  ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_EMAIL:      ${CLOUDFLARE_EMAIL:-}
      CLOUDFLARE_API_KEY:    ${CLOUDFLARE_API_KEY:-}
      DOMAIN:                ${DOMAIN}
    networks: [guac-net]

networks:
  guac-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16                # фиксированная подсеть (масштабирование)
